# Local dev profile. Credentials come from the repo's .env (see .env.sample),
# so nothing secret lives here. In the beacon_daily job, the Databricks dbt_task
# generates its own profile from warehouse_id and points DBT_PROFILES_DIR at it,
# so this file is not used there.
beacon:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: beacon
      schema: silver
      threads: 4
