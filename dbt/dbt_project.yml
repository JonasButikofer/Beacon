# Beacon transformations: bronze (ingest jobs) -> silver (staging, intermediate,
# snapshots) -> gold (seeds, marts). Runs locally with dbt Fusion and in the
# beacon_daily job with dbt-core, so stick to syntax both accept.
name: beacon
version: "1.0.0"
profile: beacon

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

models:
  beacon:
    +materialized: table
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver
    intermediate:
      +schema: silver
    marts:
      +schema: gold

snapshots:
  beacon:
    +schema: silver
    +persist_docs:
      relation: true
      columns: true

seeds:
  beacon:
    +schema: gold
    +persist_docs:
      relation: true
      columns: true
