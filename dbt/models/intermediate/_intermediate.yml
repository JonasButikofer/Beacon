version: 2

models:
  - name: int_symbol_returns
    description: >
      Trailing returns over ~1, 3 and 6 months (21, 63, 126 trading days) for
      every priced symbol, ETFs and companies, one row per (symbol, obs_date).
      Fractions: 0.05 = +5%. Null until the symbol has enough history.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, obs_date]
    columns:
      - name: symbol
        description: Ticker symbol (ETF or company)
        data_tests: [not_null]
      - name: obs_date
        description: Trading date
        data_tests: [not_null]
      - name: adj_close
        description: Split/dividend-adjusted close
      - name: return_1m
        description: Return over the last 21 trading days, as a fraction
      - name: return_3m
        description: Return over the last 63 trading days, as a fraction
      - name: return_6m
        description: Return over the last 126 trading days, as a fraction

  - name: int_macro_daily
    description: >
      Every FRED series forward-filled to a daily calendar, one row per
      (date_day, series_id), with 3- and 12-month changes. Values are as of
      obs_date, not release date, so monthly prints appear several weeks before
      they were actually published.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, series_id]
    columns:
      - name: date_day
        description: Calendar day (every day, including weekends)
        data_tests: [not_null]
      - name: series_id
        description: FRED series ID; joins to dim_indicator.series_id
        data_tests: [not_null]
      - name: obs_date
        description: Date of the observation being carried forward
      - name: days_since_obs
        description: Days between date_day and obs_date, i.e. how stale the value is
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: value
        description: Latest observed value on or before date_day, in the series' units
        data_tests: [not_null]
      - name: value_3m_ago
        description: The series' value as of 3 months before obs_date
      - name: value_12m_ago
        description: The series' value as of 12 months before obs_date
      - name: chg_3m
        description: value minus value_3m_ago, in the series' units (percentage points for rates)
      - name: chg_12m
        description: value minus value_12m_ago, in the series' units
      - name: pct_chg_12m
        description: Year-over-year % change in percent (3.1 = +3.1%). For CPIAUCSL this is the headline inflation rate. Null when the value 12 months earlier was 0.
