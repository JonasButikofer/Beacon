resources:
  jobs:
    # The ~100k-row ticker universe changes slowly and is a full overwrite, so
    # it refreshes weekly instead of with the daily batch. Sector ETF holdings
    # change slowly too and ride along; beacon_batch's company price task reads
    # both tables. Neither task calls Tiingo's metered API.
    beacon_universe_weekly:
      name: beacon_universe_weekly
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 5 ? * SUN" # Sundays 5:00 AM
        timezone_id: ${var.timezone}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests
              - openpyxl

      tasks:
        - task_key: ingest_tiingo_universe
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ../ingest/batch_tiingo_universe.py

        # State Street holdings files for XLK, XLF, XLE, XLU (free, no key).
        - task_key: ingest_etf_holdings
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ../ingest/batch_etf_holdings.py
