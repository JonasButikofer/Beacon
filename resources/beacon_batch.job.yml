# Daily batch ingestion into beacon.bronze. The ingest tasks write to
# separate tables and don't depend on each other, so they run in parallel.
# No schedule here: beacon_daily (beacon_daily.job.yml) runs it at 6:00 AM and
# starts beacon_quality when it finishes.
resources:
  jobs:
    beacon_batch:
      name: beacon_batch
      max_concurrent_runs: 1

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - requests

      tasks:
        - task_key: ingest_fred
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ../ingest/batch_fred.py

        - task_key: ingest_tiingo_eod
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ../ingest/batch_tiingo_eod.py

        # Disabled: the free Tiingo plan returns 403 on /tiingo/news. To re-enable,
        # uncomment this task and set NEWS_CHECK_ENABLED = True in agent/config.py.
        # - task_key: ingest_tiingo_news
        #   environment_key: default
        #   max_retries: 2
        #   min_retry_interval_millis: 300000
        #   spark_python_task:
        #     python_file: ../ingest/batch_tiingo_news.py

        - task_key: ingest_tiingo_tickers
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          spark_python_task:
            python_file: ../ingest/batch_tiingo_tickers.py

        # M3/M4: uncomment once dbt/ has a project. Set warehouse_id to your SQL
        # warehouse (SQL Warehouses -> your warehouse -> Overview -> ID).
